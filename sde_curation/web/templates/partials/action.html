{# one contextual button: the next step in the pipeline for this collection #}
{% set a = next_action(c, job) %}
{% if a.kind == 'post' %}
  <button class="primary" title="{{ a.hint }}" hx-post="{{ a.url }}{% if a.then %}?then={{ a.then }}{% endif %}"
          {% if a.then %}hx-swap="none"{% else %}hx-target="closest tr" hx-swap="outerHTML"{% endif %}>{{ a.label }}</button>
{% elif a.kind == 'link' %}
  <a class="button primary" href="{{ a.url }}" title="{{ a.hint }}">{{ a.label }}</a>
{% elif a.kind == 'busy' %}
  <span class="spinner"></span> <small class="muted">{{ a.label }}</small>
  <button class="mini" title="Cancel the running job" hx-post="/api/collections/{{ c.collection_id }}/jobs/cancel" hx-confirm="Cancel the running job?" hx-target="closest tr" hx-swap="outerHTML">✕</button>
{% elif a.kind == 'done' %}
  <span class="done" title="{{ a.hint }}">{{ a.label }}</span>
{% else %}
  <button disabled title="{{ a.hint }}">{{ a.label }}</button>
{% endif %}
