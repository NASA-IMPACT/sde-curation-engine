{% extends "base.html" %}
{% block content %}
<section class="toolbar">
  <form method="post" action="/collections" class="inline">
    <input name="seed_url" placeholder="https://science.nasa.gov/" required size="34">
    <input name="name" placeholder="Display name" required size="22">
    <select name="division">
      {% for d in ["General","Astrophysics","Biological and Physical Sciences","Earth Science","Heliophysics","Planetary Science"] %}
      <option>{{ d }}</option>{% endfor %}
    </select>
    <input name="max_pages" type="number" value="100000" min="1" max="100000" size="7" title="max pages">
    <button>Add collection</button>
  </form>
</section>

<table id="collections">
  <thead>
    <tr><th>Collection</th><th>Status</th><th>Dump</th><th>Delta</th><th>Curated</th><th>Last job</th><th>Updated</th><th></th></tr>
  </thead>
  <tbody sse-swap="collection_deleted" hx-swap="none">
    {% for r in rows %}{% with c=r.c, job=r.job %}{% include "partials/row.html" %}{% endwith %}{% endfor %}
    {% if not rows %}<tr><td colspan="8" class="muted">No collections yet.</td></tr>{% endif %}
  </tbody>
</table>
{% endblock %}
