[project]
name = "sde-curation-engine"
version = "0.1.0"
description = "Lightweight FastAPI curation engine for the NASA Science Discovery Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "boto3>=1.34",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[s3,ssm,ecs,sts]>=5",
    "ruff>=0.6",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sde_curation"]
