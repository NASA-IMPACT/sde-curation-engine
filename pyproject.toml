[project]
name = "sde-curation-engine"
version = "0.1.0"
description = "Lightweight FastAPI curation engine for the NASA Science Discovery Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "opensearch-py>=2.6",
    "python-slugify>=8.0.4",  # same slug rule as COSMOS: config_folder = slugify(name, separator="_")
    "ijson>=3.3",  # the crawl's documents file is one JSON array of up to 100k pages: parsed as a stream
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[ecs,s3,server,ssm,sts]>=5",
    "ruff>=0.6",
    "pytest-timeout>=2.4.0",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sde_curation"]
